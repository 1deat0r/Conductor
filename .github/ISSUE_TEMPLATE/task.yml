name: Persistent task
description: Optional durable tracking for multi-session work, dependencies or coordination
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and scope
      description: What should change, and why is a persistent Issue useful?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Relevant behavior, SPEC requirements and evidence, if known
  - type: textarea
    id: platforms
    attributes:
      label: Platform, trust and recovery impact
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or coordination
