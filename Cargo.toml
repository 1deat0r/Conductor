[workspace]
resolver = "3"
members = ["crates/protocol", "crates/host", "crates/supervisor"]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = "0.10.9"
